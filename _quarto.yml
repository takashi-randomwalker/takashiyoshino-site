project:
  type: website
  # Rebuild the publication list from ORCID before every render
  pre-render: python3 scripts/orcid.py
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "lectures/**/*.qmd"

lang: ja

website:
  title: "Takashi Yoshino"
  site-url: https://takashiyoshino.random-walk.org
  description: "Activities of a man of science, art, literature, and music"
  navbar:
    left:
      - href: index.qmd
        text: Profile
      - href: publications.qmd
        text: Publications
      - href: posts.qmd
        text: Notes
      # Uncomment when lectures/index.qmd is no longer a draft
      # - href: lectures/index.qmd
      #   text: Lectures
    right:
      - icon: github
        href: https://github.com/takashi-randomwalker
        aria-label: GitHub
  # One sidebar per course: table of contents for all its lectures
  sidebar:
    - id: katachi
      title: "形の科学特論"
      contents: lectures/katachi
  page-navigation: true
  page-footer:
    center: "© Takashi Yoshino"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    html-math-method: mathjax
