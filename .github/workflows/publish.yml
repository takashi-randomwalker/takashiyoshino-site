# Build the site with Quarto and publish it to GitHub Pages.
# Runs on every push to main, once a week (to pick up new works on ORCID),
# and by hand from the Actions tab.
name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0"   # Monday 03:00 JST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - uses: actions/configure-pages@v6
      - run: quarto render   # pre-render runs scripts/orcid.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
